name: Publish the course app

# Publishes figures/course/ to GitHub Pages on every push to main.
# The app's index.html is written for claude.ai, which wraps it in a full document at publish time;
# this workflow adds the same wrapper (doctype, charset, viewport, small reset) for Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r figures/course/. _site/
          { cat .github/pages-head.html; cat figures/course/index.html; printf '\n</body></html>\n'; } > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
