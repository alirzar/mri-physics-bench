<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Larmor top and RF tuner</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Top: the net magnetization; once tipped it precesses about B0</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Dial: RF frequency, with dots at the Larmor frequency for 1.5, 3 and 7 T</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Lightbox: the signal the tipped magnetization gives, MNI152 slice z = +14 mm</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Analyzer: the brain's spectrum in ppm (water suppressed), with a fine-tuning cursor; the display shows how many hertz one ppm is at this field</span></span><span class="iso-caption">A magnetic moment in a field precesses like a tilted spinning top, at the Larmor frequency f0 = γ̄·B0, with γ̄ = 42.577 MHz per tesla for hydrogen: 63.9 MHz at 1.5 T, 127.7 MHz at 3 T and 298.0 MHz at 7 T. The top is drawn slowed about 255 million times. At rest the net magnetization points straight along B0 and nothing precesses. An RF pulse is a small magnetic field turning at the radio frequency; only when that frequency matches f0 does it keep pushing the top the same way, tipping it over (resonance). Off resonance the pushes cancel and the top barely moves. The tip follows the Bloch equations for a rectangular pulse that gives 90° on resonance. Real pulses are resonant within about a kilohertz (an RF strength of a few hundred hertz, about 250 Hz for a 1 ms 90° pulse); the dial draws the resonance about 3 MHz wide so it can be found by hand. The scanner can only detect magnetization that has been tipped into the transverse plane, so the film's brightness follows sin(tip): no resonance, no image. The return to upright is relaxation, the subject of Fig 3. The spectrum analyzer zooms in a few parts per million (ppm) around f0. Hydrogen in different molecules is shielded slightly differently by its electrons, so it resonates slightly off: in brain spectra NAA sits at 2.01 ppm, creatine at 3.03 ppm and choline at 3.20 ppm, while water at 4.7 ppm is thousands of times stronger and is suppressed before the measurement. The positions are fixed in ppm, but in hertz they grow with the field: 1 ppm is 64 Hz at 1.5 T, 128 Hz at 3 T and 298 Hz at 7 T. Lines broaden too (drawn about 6, 8, 12 Hz wide), but more slowly, so creatine and choline separate better at higher field. Like the image, the spectrum appears only when the magnetization has been tipped. Peak heights are illustrative. The film is a synthetic image: each 1 mm pixel is the sum of its GM, WM and CSF fractions times that tissue's signal, using the tissue probability maps of the MNI152 ICBM 2009c Nonlinear Asymmetric template (Fonov et al., NeuroImage 2011; via TemplateFlow). Brain only, no skull or scalp; real images add noise, coil shading and tissues this model leaves out. MNI152 template: Copyright (C) 1993–2004 Louis Collins, McConnell Brain Imaging Centre, Montreal Neurological Institute, McGill University.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

// Larmor precession and RF resonance, shared by the build and the live page.
// f0 = γ̄·B0 with γ̄ = 42.577 MHz/T for hydrogen. A rectangular RF pulse at frequency f_rf tips the net
// magnetization about the effective field in the rotating frame: with detuning Δ = f0 − f_rf and RF
// strength f1, the axis sits at θ = atan(f1/Δ) from z and turns by β = 2π·√(f1² + Δ²)·τ. Starting along z,
// Mz = cos²θ + sin²θ·cos β. The pulse length is set so that on resonance it gives exactly 90°.
// Real pulses are resonant within about a kilohertz; the dial draws the resonance far wider (F1 below)
// so it can be found by hand. The card says so.

const GAMMA_BAR = 42.577; // MHz per tesla
const B0_OPTIONS = [1.5, 3, 7];
const TUNER_RANGE = [0, 320]; // MHz on the dial
const F1 = 3; // MHz, RF strength as drawn (real: a few hundred Hz)
const REAL_F1_HZ = 250; // Hz, a typical 1 ms 90° pulse
const PULSE_FLIP = 90; // degrees on resonance

const larmorOf = (B0) => GAMMA_BAR * B0;

// tip angle (radians) after fraction u (0..1) of the pulse, for detuning delta (MHz)
function tipOf(delta, u = 1) {
  const theta = Math.atan2(F1, delta);
  const beta = ((PULSE_FLIP * Math.PI) / 180) * (Math.hypot(F1, delta) / F1) * u;
  const mz = Math.cos(theta) ** 2 + Math.sin(theta) ** 2 * Math.cos(beta);
  return Math.acos(Math.max(-1, Math.min(1, mz)));
}

// precession as drawn: half a turn per second at 3 T, in proportion to B0
const shownTurnsPerSecond = (B0) => 0.5 * (B0 / 3);
const slowdownOf = (B0) => (larmorOf(B0) * 1e6) / shownTurnsPerSecond(B0);

// MR spectroscopy: hydrogen in different molecules resonates a few parts per million (ppm) apart, because
// the electrons around it shield it slightly from B0. Peak positions are fixed in ppm; in hertz the spacing
// grows with B0 (1 ppm of f0, in Hz, equals f0 in MHz). Lines are Lorentzians with a typical in-vivo width
// that also grows with field, but more slowly, so peaks separate better at higher B0.
const METABOLITES = [
  { name: "NAA", ppm: 2.01, amp: 1.0, label: true },
  { name: "Cr", ppm: 3.03, amp: 0.62, label: true },
  { name: "Cho", ppm: 3.2, amp: 0.5, label: true },

  { name: "Cr", ppm: 3.92, amp: 0.36, label: false },

const PPM_RANGE = [4.1, 1.7]; // left → right, as spectra are drawn

const linewidthHz = (B0) => 4 + 1.2 * B0;
function spectrumAt(ppm, B0) {
  const half = linewidthHz(B0) / 2 / hzPerPpm(B0); // half width at half height, in ppm
  let v = 0;
  for (const m of METABOLITES) v += m.amp / (1 + ((ppm - m.ppm) / half) ** 2);
  return v;
}

// opts.signed: a difference image (values below zero show black instead of folding back as magnitude)
function makeFilm(svg, slice, keys, part = "film-0", opts = {}) {
  const unpack = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const maps = (makeFilm.cache ||= {});

  canvas.width = slice.width;
  canvas.height = slice.height;

  let grain = null;

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

const PULSE = 0.9, HOLD = 3.6, RELAX = 0.9; // seconds as drawn
let B0 = 3, b0Shown = B0, tune = 80, tuneShown = tune;
let alpha = 0, phi = 0, spin = 0, phase = "idle", since = 0, pulseDelta = 0, alphaStart = 0;
let clock = 0, frame = 0, last = 0, visible = false, touring = !still.matches, idleTimer = 0, tourAt = 0, pressed = -1e9;
let cursor = 3.03, cursorShown = cursor;

const TOUR = [
  { at: 0.0, B0: 3, tune: 80 }, { at: 1.4, fire: true },
  { at: 4.2, tune: larmorOf(3) }, { at: 5.6, fire: true }, { at: 8.0, B0: 7 },
  { at: 12.0, tune: larmorOf(7) }, { at: 13.4, fire: true },
  { at: 18.6, B0: 1.5, tune: larmorOf(1.5) }, { at: 20.0, fire: true },
  { at: 26.0, loop: true },
];

function transmit() {
  if (phase !== "idle") return;
  phase = "pulse"; since = 0; pulseDelta = larmorOf(B0) - tune; pressed = clock;
}

function draw() {
  top.innerHTML = topSvg(K, P, PIVOT, alpha, phi, spin);
  sweep.setAttribute("d", sweepOf(K, P, PIVOT, alpha));
  tuner.setAttribute("d", lineOnTop([fx(tuneShown), WIN_Y], [fx(tuneShown), WIN_Y + WIN_D], GEN_H + 0.1, P));
  tunePointer.setAttribute("d", pointerOf(K, P, TUNE_KNOB, (tuneShown / TUNER_RANGE[1]) * 300 - 150, 6, GEN_H + 7.2));
  const detent = b0Shown <= 3 ? DETENTS[0] + ((b0Shown - 1.5) / 1.5) * (DETENTS[1] - DETENTS[0]) : DETENTS[1] + ((b0Shown - 3) / 4) * (DETENTS[2] - DETENTS[1]);
  b0Pointer.setAttribute("d", pointerOf(K, P, SEL_C, detent, 5, SEL_Z));
  const rf = phase === "pulse" ? 1 : 0;
  lamp.setAttribute("opacity", String(rf));
  coilGlow.setAttribute("opacity", String(rf));
  fire.setAttribute("transform", translateAlong(P, [0, 0, -1.8 * Math.exp(-Math.max(0, clock - pressed) / 0.25)]));
  paintFilm(TISSUES.map((t) => t.PD * Math.sin(alpha)));
  // spectrum: only tipped magnetization gives a signal to analyse
  const gain = (SPEC_AMP * Math.sin(alpha)) / peakOf(B0);
  const pts = [];
  for (let i = 0; i <= 240; i++) { const ppm = PPM_RANGE[0] - i * 0.01; pts.push(iso([px(ppm), SCREEN_Y, SPEC_BASE + gain * spectrumAt(ppm, B0)], P)); }
  mrsTrace.setAttribute("d", pathOf(pts));
  mrsCursor.setAttribute("d", pathOf([iso([px(cursorShown), SCREEN_Y, SCREEN.z0], P), iso([px(cursorShown), SCREEN_Y, SCREEN.z1], P)]));
  finePointer.setAttribute("d", pointerOf(K, P, FINE_KNOB, -135 + (270 * (PPM_RANGE[0] - cursorShown)) / (PPM_RANGE[0] - PPM_RANGE[1]), 3.8, FINE_Z));
  for (const label of mrsLabels) label.el.setAttribute("data-tone", Math.abs(cursorShown - label.ppm) < 0.07 ? "hi" : "lo");
  const lcd = "1 ppm = " + Math.round(hzPerPpm(B0)) + " Hz";
  if (mrsLcd.textContent !== lcd) mrsLcd.textContent = lcd;
  const f0 = larmorOf(B0);
  const off = tune - f0;
  const match = Math.abs(off) < 0.5 ? "on resonance" : "off by " + Math.abs(off).toFixed(0) + " MHz";
  const text = "B0 " + B0 + " T · f0 " + f0.toFixed(1) + " MHz · RF " + tune.toFixed(1) + " MHz · " + match + " · tip " + Math.round((alpha * 180) / Math.PI) + "°";
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}

function tick(stamp) {
  const dt = last ? Math.min((stamp - last) / 1000, 1 / 30) : 1 / 60;
  last = stamp;
  clock += dt;
  if (touring) {
    const t = clock - tourAt;
    for (const step of TOUR) {
      if (step.done || t < step.at) continue;
      step.done = true;
      if (step.loop) { TOUR.forEach((s) => (s.done = false)); tourAt = clock; break; }
      if (step.B0) B0 = step.B0;
      if (step.tune !== undefined) tune = step.tune;
      if (step.fire) transmit();
    }
  }
  const ease = 1 - Math.exp(-dt / 0.35);
  if (touring) cursor = 2.9 + 1.0 * Math.sin(clock * 0.55);
  cursorShown += (cursor - cursorShown) * ease;
  tuneShown += (tune - tuneShown) * ease;
  b0Shown += (B0 - b0Shown) * ease;
  since += dt;
  if (phase === "pulse") {
    alpha = tipOf(pulseDelta, Math.min(1, since / PULSE));
    if (since >= PULSE) { since = 0; phase = alpha < 0.1 ? "relax" : "hold"; alphaStart = alpha; }
  } else if (phase === "hold") {
    if (since >= HOLD) { phase = "relax"; since = 0; alphaStart = alpha; }
  } else if (phase === "relax") {
    alpha = alphaStart * Math.exp(-since / (RELAX / 3));
    if (since >= RELAX * 1.6) { phase = "idle"; alpha = 0; }
  }
  phi += 2 * Math.PI * shownTurnsPerSecond(b0Shown) * dt;
  spin += 2 * Math.PI * 2.2 * dt;
  draw();
  frame = visible ? requestAnimationFrame(tick) : 0;
}

const go = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
function user() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; tourAt = clock; TOUR.forEach((s) => (s.done = false)); }, 9000);
}
function setTune(f) { user(); tune = clamp(f, TUNER_RANGE[0], TUNER_RANGE[1]); if (still.matches) { tuneShown = tune; draw(); } go(); }
function setB0(b) { user(); B0 = b; if (still.matches) { b0Shown = B0; draw(); } go(); }
function setCursor(ppm) { cursor = clamp(ppm, PPM_RANGE[1], PPM_RANGE[0]); if (still.matches) { cursorShown = cursor; draw(); } go(); }
function fireNow() {
  user();
  if (still.matches) { alpha = tipOf(larmorOf(B0) - tune); draw(); return; }
  transmit(); go();
}
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) go(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  setTune(clamp(((event.clientX - box.left) / box.width - 0.12) / 0.76, 0, 1) * TUNER_RANGE[1]);
  setCursor(PPM_RANGE[0] - clamp(((event.clientY - box.top) / box.height - 0.15) / 0.7, 0, 1) * (PPM_RANGE[0] - PPM_RANGE[1]));
});
stage.addEventListener("click", fireNow);
stage.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 10 : 1;
  if (event.key === "ArrowRight") setTune(tune + step);
  else if (event.key === "ArrowLeft") setTune(tune - step);
  else if (event.key === "t" || event.key === "T") setTune(larmorOf(B0));
  else if (event.key === "ArrowUp") { user(); setCursor(cursor + 0.05); }
  else if (event.key === "ArrowDown") { user(); setCursor(cursor - 0.05); }
  else if (event.key === "Enter" || event.key === " ") fireNow();
  else if (/^[1-3]$/.test(event.key)) setB0(B0_OPTIONS[Number(event.key) - 1]);
  else return;
  event.preventDefault();
});
if (still.matches) { tune = tuneShown = larmorOf(B0); alpha = tipOf(0); phi = 0.6; }
draw();
</script></body></html>
