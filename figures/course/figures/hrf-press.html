<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HRF printing press</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

 class="iso-line" data-tone="mid" d="M290.9 250L287.4 246.2M321.6 243.9L321.6 239.4M352.3 271.5L355.8 270.2"/><text class="iso-face-text" data-tone="mid" transform="matrix(1.249 0.437 0 1.321 285.149 245.096)" font-size="3" text-anchor="middle">1</text><text class="iso-face-text" data-tone="mid" transform="matrix(1.249 0.437 0 1.321 321.581 237.801)" font-size="3" text-anchor="middle">10</text><text class="iso-face-text" data-tone="mid" transform="matrix(1.249 0.437 0 1.321 358.013 270.607)" font-size="3" text-anchor="middle">100%</text><text class="iso-face-text" data-tone="lo" transform="matrix(1.249 0.437 0 1.321 347.984 274.652)" font-size="2.6" text-anchor="middle">1</text><text class="iso-face-text" data-tone="lo" transform="matrix(1.249 0.437 0 1.321 302.975 250.613)" font-size="2.6" text-anchor="middle">2</text><text class="iso-face-text" data-tone="lo" transform="matrix(1.249 0.437 0 1.321 308.821 249.193)" font-size="2.6" text-anchor="middle">3</text><text class="iso-face-text" data-tone="lo" transform="matrix(1.249 0.437 0 1.321 319.122 250.115)" font-size="2.6" text-anchor="middle">4</text><text class="iso-face-text" data-tone="mid" transform="matrix(1.249 0.437 0 1.321 321.581 289.576)" font-size="3.2" text-anchor="middle">detection efficiency</text><text class="iso-face-text" data-tone="lo" transform="matrix(1.249 0.437 0 1.321 321.581 294.859)" font-size="2.6" text-anchor="middle">% of blocked, log scale</text><path data-part="needle" class="iso-line" data-tone="lit" data-free="" d="" style="stroke-width:1.1"/><g class="iso-dots" data-tone="hi"><circle cx="321.6" cy="283.5" r="1.6"/></g><g class="iso-dots" data-tone="mid"><circle cx="293.8" cy="206" r="0.45"/><circle cx="277.4" cy="217.8" r="0.45"/><circle cx="387.3" cy="238.8" r="0.45"/><circle cx="370.8" cy="250.5" r="0.45"/></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Lit trace: the predicted signal, the sum of every printed response</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Dashed: the response printed for each second of stimulus</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Stamp: SPM's canonical haemodynamic response (HRF), carried along the design</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Lightbox: the design matrix, one row per scan (TR 2 s): stimulus, predicted signal, constant</span></span><span class="iso-caption">If the BOLD response adds up linearly (nearly true, Fig 9), the signal predicted for any design is the design convolved with one response shape: every second of stimulus prints a copy of the haemodynamic response, and the copies add. The press does exactly that, and the sum, sampled once per scan, becomes a column of the design matrix used in the analysis (Fig 11). The dial shows detection efficiency: how precisely a run of 160 s can estimate the size of the response, which grows with how much the predicted signal varies from scan to scan once the mean and slow drifts (SPM's 128 s high-pass filter) are removed. Blocked (1): responses pile up into large plateaus that come and go, the best design for detecting activation (100%). Slow (2): one event every 16 s gives clean, separate responses that show the response's shape, but only 10 events fit in the run (2.3%). Fast fixed (3): an event every 2 s fuses into a flat plateau; with almost nothing varying there is almost nothing to detect (3.8%). Jittered (4): the same 2 s slots filled at random, with 44 events instead of 78, so the signal rises and falls, and the efficiency more than doubles (8.3%); this is why event-related experiments jitter their timing or mix in null events. Model: SPM's canonical HRF (difference of two gamma functions, peak at 5 s, undershoot near 16 s); 1 s per event; white noise assumed; the display gain (×1, ×2, ×4) changes so each design fills the paper. Detection is not everything: blocked designs are predictable, and comparing trial types needs them mixed in an order the analysis can separate.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;

`;

// HRF printing press: the predicted BOLD signal is the stimulus design convolved with the haemodynamic response,
// and some designs give far more signal to detect than others. Shared by the build and the live page.
//   prediction(t) = Σ over stimulus seconds tₑ of hrf(t − tₑ)          (every second of stimulus prints one HRF)
//   hrf(t) = Γ(6,1) density − Γ(16,1) density / 6                     (SPM's canonical double gamma: peak ~5 s,
//                                                                       undershoot ~15 s)
// Detection efficiency of a design is 1 / var(β̂) for its regressor (up to the noise variance): the sum of squares
// of the regressor sampled at each scan, after the constant and SPM's 128 s high-pass filter (a discrete cosine set)
// are projected out. More variation in the predicted signal → more to detect.

const TR = 2; // s
const RUN_S = 160; // s per run
const SCANS = RUN_S / TR;
const HRF_S = 32; // s of response drawn per stamp
const HP_CUTOFF = 128; // s

const LG6 = Math.log(120), LG16 = Math.log(1307674368000); // ln Γ(6), ln Γ(16)
const hrf = (t) => (t <= 0 ? 0 : Math.exp(5 * Math.log(t) - t - LG6) - Math.exp(15 * Math.log(t) - t - LG16) / 6);

const range = (a, b, step) => { const out = []; for (let t = a; t <= b + 1e-9; t += step) out.push(t); return out; };
// jittered: each 2 s slot holds an event with probability 1/2 (a fixed random order, seed 3)
const JITTERED = (() => { let s = 3; const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) + 0.5) / 4294967296; return range(4, 158, 2).filter(() => r() < 0.5); })();
const BLOCKS = [[4, 24], [44, 64], [84, 104], [124, 144]];

// each stamp is one second of stimulus
const DESIGNS = [
  { key: "blocked", label: "blocked", stamps: BLOCKS.flatMap(([a, b]) => range(a, b - 1, 1)), note: "4 blocks of 20 s" },
  { key: "slow", label: "slow", stamps: range(4, 148, 16), note: "an event every 16 s" },
  { key: "fast", label: "fast fixed", stamps: range(4, 158, 2), note: "an event every 2 s" },
  { key: "jitter", label: "jittered", stamps: JITTERED, note: "random 2 s slots" },
];

function predictionAt(design, t) {
  let v = 0;
  for (const te of design.stamps) if (te < t && t - te < 40) v += hrf(t - te);
  return v;
}
const regressorOf = (design) => Array.from({ length: SCANS }, (_, n) => predictionAt(design, n * TR));
const stimulusOf = (design) => Array.from({ length: SCANS }, (_, n) => (design.stamps.some((te) => n * TR >= te && n * TR < te + 1) ? 1 : 0));

// residual of the regressor after the constant and the high-pass cosine set, then its sum of squares
function efficiencyOf(design) {
  const x = regressorOf(design);
  const kmax = Math.floor((2 * SCANS * TR) / HP_CUTOFF);
  for (let k = 0; k <= kmax; k++) {
    const b = Array.from({ length: SCANS }, (_, n) => Math.cos((Math.PI * k * (n + 0.5)) / SCANS));
    const bb = b.reduce((a, v) => a + v * v, 0);
    const d = b.reduce((a, v, n) => a + v * x[n], 0) / bb;
    for (let n = 0; n < SCANS; n++) x[n] -= d * b[n];
  }
  return x.reduce((a, v) => a + v * v, 0);
}
// display gain: the largest of ×1, ×2, ×4 that keeps the prediction on the paper
function gainOf(design) {
  let max = 0;
  for (let t = 0; t <= RUN_S; t += 0.25) max = Math.max(max, predictionAt(design, t));
  return [4, 2, 1].find((g) => g * max <= 1.0) ?? 1;
}

const P = {"origin":[290.3774381564636,228.567563626612],"scale":1.2057207447120253,"azimuth":55,"elevation":30};
const INFO = [{"eff":100,"gain":1},{"eff":2.2853993478809755,"gain":4},{"eff":3.76703103294803,"gain":2},{"eff":8.326076505065947,"gain":2}];
const TX0 = -126, KT = 1, PAPER_Y = -35.6, STAMP_Y = -34.4, DESIGN_Z = 14, PRED_Z0 = 28, PRED_K = 44;
const DIAL_Y = 64.3, PIVOT = [70,12], DIAL_R = 30, SWING = 55;
const angleOf = (pct) => -SWING + (2 * SWING * Math.log10(Math.min(100, Math.max(1, pct)))) / 2;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const q = (name) => svg.querySelector('[data-part="' + name + '"]');
const [barsDone, barsTodo] = q("bars").querySelectorAll("path");
const copies = q("copies"), sum = q("sum"), carriage = q("carriage"), stamp = q("stamp"), profile = q("profile"), gainText = q("gain"), needle = q("needle"), goButton = q("go");
const keyLamps = DESIGNS.map((_, i) => q("key-lamp-" + i));
const film = q("film-0");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const SPEED = 12; // seconds of run per second
const HOLD = 2.6;
const STEP = 0.25;

// per design: the prediction sampled every 0.25 s, each stamp's printed response, the regressor and stimulus per scan
const PREP = DESIGNS.map((d, i) => {
  const gain = INFO[i].gain;
  const zOf = (v) => PRED_Z0 + v * gain * PRED_K;
  const pred = []; for (let t = 0; t <= RUN_S + 1e-9; t += STEP) pred.push(predictionAt(d, t));
  const copy = d.stamps.map((te) => { const pts = []; for (let s = 0; s <= Math.min(HRF_S, RUN_S - te) + 1e-9; s += 0.5) pts.push(iso([TX0 + (te + s) * KT, PAPER_Y, zOf(hrf(s))], P)); return pathOf(pts); });
  const bar = d.stamps.map((te) => pathOf([[te, DESIGN_Z], [te + 1, DESIGN_Z], [te + 1, DESIGN_Z + 5], [te, DESIGN_Z + 5]].map(([tt, z]) => iso([TX0 + tt * KT, PAPER_Y, z], P)), true));
  const prof = []; for (let s = 0; s <= HRF_S + 1e-9; s += 0.5) prof.push(iso([TX0 + s * KT, STAMP_Y, zOf(hrf(s))], P));
  const reg = regressorOf(d), stim = stimulusOf(d);
  return { gain, zOf, pred, copy, bar, profile: pathOf(prof), reg, stim, min: Math.min(...reg), max: Math.max(...reg) };
});

// the design matrix film: stimulus, predicted signal, constant; rows not yet scanned stay dark
const canvas = document.createElement("canvas");
canvas.width = 54; canvas.height = SCANS;
const ctx = canvas.getContext("2d");
const image = ctx.createImageData(54, SCANS);
let filmKey = "";
function paintFilm(di, t) {
  const rows = Math.min(SCANS, Math.floor(t / TR + 1e-9) + 1);
  const key = di + ":" + rows;
  if (key === filmKey) return;
  filmKey = key;
  const p = PREP[di];
  const px = image.data;
  const shade = (v) => Math.round(2.55 * (6 + 88 * v));
  for (let n = 0; n < SCANS; n++) for (let c = 0; c < 54; c++) {
    const col = c < 16 ? 0 : c < 19 ? -1 : c < 35 ? 1 : c < 38 ? -1 : 2;
    let g = 10;
    if (col >= 0 && n < rows) g = shade(col === 0 ? p.stim[n] : col === 1 ? (p.reg[n] - p.min) / (p.max - p.min || 1) : 1);
    else if (col >= 0) g = 22;
    const o = (n * 54 + c) * 4;
    px[o] = px[o + 1] = px[o + 2] = g; px[o + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
  film.setAttribute("href", canvas.toDataURL());
}

let di = 3, t = 0, hold = 0, frame = 0, last = 0, clock = 0, visible = false, touring = !still.matches, idleTimer = 0, tourAt = 0, pressAt = -1e9, goAt = -1e9, scrubbing = false;
let needleShown = angleOf(INFO[di].eff), shownStamps = -1;

function drawDesign() {
  const p = PREP[di];
  profile.setAttribute("d", p.profile);
  gainText.textContent = "×" + p.gain;
  keyLamps.forEach((el, i) => el.setAttribute("opacity", i === di ? "1" : "0"));
  shownStamps = -1;
}

function draw() {
  const d = DESIGNS[di], p = PREP[di];
  const n = d.stamps.filter((te) => te < t || (t >= RUN_S && te <= t)).length;
  if (n !== shownStamps) {
    if (n > shownStamps && shownStamps >= 0) pressAt = clock;
    shownStamps = n;
    copies.setAttribute("d", p.copy.slice(0, n).join(""));
    barsDone.setAttribute("d", p.bar.slice(0, n).join(""));
    barsTodo.setAttribute("d", p.bar.slice(n).join(""));
  }
  const m = Math.round(t / STEP);
  const pts = [];
  for (let i = 0; i <= m; i += 2) pts.push(iso([TX0 + i * STEP * KT, PAPER_Y, p.zOf(p.pred[i])], P));
  pts.push(iso([TX0 + t * KT, PAPER_Y, p.zOf(p.pred[m])], P));
  sum.setAttribute("d", pathOf(pts));
  carriage.setAttribute("transform", translateAlong(P, [t * KT, 0, 0]));
  stamp.setAttribute("transform", translateAlong(P, [0, -1.1 * Math.exp(-Math.max(0, clock - pressAt) / 90), 0]));
  goButton.setAttribute("transform", translateAlong(P, [0, 0, -1.6 * Math.exp(-Math.max(0, clock - goAt) / 200)]));
  const a = (needleShown * Math.PI) / 180;
  needle.setAttribute("d", pathOf([[0, -2.5], [0, DIAL_R - 3]].map(([, r], j) => iso([PIVOT[0] + Math.sin(a) * (j ? r : -2.5), DIAL_Y + 0.2, PIVOT[1] + Math.cos(a) * (j ? r : -2.5)], P))));
  paintFilm(di, t);
  const eff = INFO[di].eff;
  const text = d.label + " · " + (d.key === "blocked" ? "4 blocks of 20 s" : d.stamps.length + " events") + " · efficiency " + (eff >= 10 ? Math.round(eff) : eff.toFixed(1)) + "% of blocked · t " + Math.round(t) + " s";
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}

function restart() { t = 0; hold = 0; goAt = clock; drawDesign(); }

function tick(stamp_) {
  const dt = last ? Math.min((stamp_ - last) / 1000, 1 / 30) : 1 / 60;
  last = stamp_;
  clock += dt * 1000;
  needleShown += (angleOf(INFO[di].eff) - needleShown) * (1 - Math.exp(-dt / 0.35));
  if (scrubbing) hold = 0;
  else if (t < RUN_S) t = Math.min(RUN_S, t + dt * SPEED);
  else {
    hold += dt;
    if (hold > HOLD && touring) { di = tourAt++ % DESIGNS.length; restart(); }
  }
  draw();
  frame = visible ? requestAnimationFrame(tick) : 0;
}

const go = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
function user() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; scrubbing = false; }, 9000);
}
function choose(i) {
  user();
  scrubbing = false;
  if (i !== undefined) di = i;
  restart();
  if (still.matches) { t = RUN_S; needleShown = angleOf(INFO[di].eff); draw(); return; }
  go();
}
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) go(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  user();
  scrubbing = true;
  const box = svg.getBoundingClientRect();
  t = clamp(((event.clientX - box.left) / box.width - 0.12) / 0.76, 0, 1) * RUN_S;
  hold = 0;
  if (still.matches) draw(); else go();
});
stage.addEventListener("pointerleave", () => { scrubbing = false; });
stage.addEventListener("click", () => choose());
stage.addEventListener("keydown", (event) => {
  if (/^[1-4]$/.test(event.key)) choose(Number(event.key) - 1);
  else if (event.key === "Enter" || event.key === " ") choose();
  else return;
  event.preventDefault();
});
if (still.matches) t = RUN_S;
drawDesign();
draw();
</script></body></html>
