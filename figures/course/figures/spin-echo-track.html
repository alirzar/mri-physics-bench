<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spin-echo track</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

velope e^(−t/T2*), set by the shim</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Lightbox: one film per echo, MNI152 slice z = +14 mm</span></span><span class="iso-caption">Eight spins in the rotating frame precess up to 22 Hz faster or slower than the scanner's reference because the field is not perfectly uniform. After the 90° pulse they fan out and the free induction decay collapses within milliseconds: T2* decay. Spin echo (SE): each 180° pulse flips every phase; since each spin keeps its own speed, they all come back into phase one TE later, and every refocusing pulse makes a new echo, an echo train. The echoes shrink along the true T2 decay, e^(−t/T2), which no pulse can undo. Turning the shim knob toward a poorer shim spreads the speeds further (T2′ = 10 ms divided by the shim factor): the FID and the sides of each echo get narrower, but the echo peaks stay on the T2 curve. Gradient echo (GRE): there is no 180° pulse. A readout gradient first spreads the spins across the voxel and then gathers them again, alternating in sign to make an echo train; at each echo its own effect cancels, but the field's spread keeps growing, so the echoes fall on the T2* curve instead. A good shim (T2* near 29 ms here) leaves usable gradient echoes; a poor one wipes them out, while the spin echoes at the same TE would barely change. That is why spin echoes are insensitive to field inhomogeneity and gradient echoes are not, and why gradient echoes see the small field changes BOLD fMRI depends on. The shim range here is exaggerated so the cars move visibly; a well-shimmed brain at 3 T has T2* of about 50–65 ms. The recorder trace uses a continuous (Lorentzian) spread of frequencies, of which the eight cars are a sample; reversing the cars is the classic runners picture, while the real pulse mirrors the phases, which gives the same signal. RF and gradient rows are schematic: shapes and order are right, lobe sizes and pulse widths are not to scale. Each film is exposed from its 180° pulse to its echo for white matter, grey matter and CSF (T2 80, 110 and 2000 ms; proton density 0.7, 0.8 and 1.0; long TR) on one fixed display window: later echoes are darker and more strongly T2-weighted, and fitting the four of them pixel by pixel is how a T2 map is made. The film is a synthetic image: each 1 mm pixel is the sum of its GM, WM and CSF fractions times that tissue's signal, using the tissue probability maps of the MNI152 ICBM 2009c Nonlinear Asymmetric template (Fonov et al., NeuroImage 2011; via TemplateFlow). Brain only, no skull or scalp; real images add noise, coil shading and tissues this model leaves out. MNI152 template: Copyright (C) 1993–2004 Louis Collins, McConnell Brain Imaging Centre, Montreal Neurological Institute, McGill University.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

// Spin echo, gradient echo and echo trains in the rotating frame, shared by the build and the live page.
// Eight isochromats with static off-resonance offsets (field inhomogeneity) dephase after the 90° pulse.
// Spin echo (SE): each 180° pulse at (j − ½)·TE mirrors every phase (φ → −φ); each spin keeps its own offset,
// so all are back in phase at j·TE. Echo heights fall only by irreversible T2 decay, e^(−j·TE/T2).
// On the track each 180° pulse is shown as every car reversing (the classic runners picture): the phase
// it gives is the mirror image of the true one, and the net signal is identical.
// Gradient echo (GRE): no refocusing pulse. A readout gradient first dephases the spins across the voxel and
// then rephases them; its own effect cancels at each echo (the gradient moment returns to zero), but nothing
// undoes the field's spread, so echo heights fall as e^(−t/T2*).
// The shim factor scales the spread of offsets: a poorer shim (larger factor) shortens T2*. It narrows spin
// echoes but leaves their heights alone; it lowers every gradient echo.

const OFFSETS = [-22, -15, -9, -4, 4, 9, 15, 22]; // Hz at shim 1, one per lane (inner → outer)
const T2 = 100; // ms, the recorder's tissue
const T2_PRIME_BASE = 10; // ms, reversible dephasing at shim 1
const SHIM_RANGE = [0.25, 2.5];
const TE_RANGE = [10, 120]; // ms, echo spacing
const N_MAX = 4;
const T_SPAN = 400; // ms shown on the recorder
const MODES = ["SE", "GRE"];
const GRAD_TWIST = 2.5; // radians across the voxel at full gradient moment (cars, GRE)
const GRAD_SHARPNESS = 8; // how fast the readout gradient dephases the voxel's signal (schematic)

const TISSUES = [
  { key: "wm", name: "WM", T2: 80, PD: 0.7 },
  { key: "gm", name: "GM", T2: 110, PD: 0.8 },
  { key: "csf", name: "CSF", T2: 2000, PD: 1.0 },
];

const t2PrimeOf = (shim) => T2_PRIME_BASE / shim;
const t2StarOf = (shim) => 1 / (1 / T2 + shim / T2_PRIME_BASE);
const maxEchoes = (TE) => Math.max(1, Math.min(N_MAX, Math.floor(T_SPAN / TE - 0.5)));
const endOf = (TE, N) => (N + 0.5) * TE;
const pulseTimes = (TE, N) => [0, ...Array.from({ length: N }, (_, j) => (j + 0.5) * TE)];

function refocusCount(t, TE, N) {
  let n = 0;
  for (let j = 1; j <= N; j++) if (t >= (j - 0.5) * TE) n = j;
  return n;
}

const halfWidth = (TE) => Math.min(10, TE / 6); // RF pulse half-width
const prephase = (TE) => [halfWidth(TE) + 0.5, TE / 2 - halfWidth(TE) - 0.5];
const readHalf = (TE) => Math.min(8, TE / 2 - halfWidth(TE) - 0.5);

// GRE readout gradient moment: 0 after the pulse, −1 at the end of the prephaser (TE/2), then a triangle
// wave from alternating readout lobes that passes through zero at every echo, n·TE
function momentOf(t, TE) {
  const a = halfWidth(TE) + 0.5;
  if (t <= a) return 0;
  if (t < TE / 2) return -(t - a) / (TE / 2 - a);
  const u = (t - TE / 2) / TE;
  const n = Math.floor(u);
  return (n % 2 === 0 ? 1 : -1) * (2 * (u - n) - 1);
}

// car phase (radians). SE: direction flips at every 180° pulse. GRE: field spread plus the gradient's twist
// across the voxel (lane runs from −1 inner to +1 outer)
function phaseOf(offset, t, TE, N, shim, mode = "SE", lane = 0) {
  const w = (2 * Math.PI * offset * shim) / 1000;
  if (mode === "GRE") return w * t + GRAD_TWIST * lane * momentOf(t, TE);
  const n = refocusCount(t, TE, N);
  const since = t - n * TE;
  return w * (n % 2 ? -since : since);
}

// Real tissue has a continuous (Lorentzian) spread of offsets; the cars are a sample of it. SE: dephasing is
// exponential in the time from the last refocus point (0 for the FID, j·TE after pulse j). GRE: dephasing
// from the field runs on unchecked, and the readout gradient adds its own, which vanishes at each echo.
function decayOf(t, TE, N, shim, t2, mode = "SE") {
  if (mode === "GRE") return Math.exp(-t / t2) * Math.exp(-t / t2PrimeOf(shim)) * Math.exp(-GRAD_SHARPNESS * Math.abs(momentOf(t, TE)));
  const n = refocusCount(t, TE, N);
  return Math.exp(-t / t2) * Math.exp(-Math.abs(t - n * TE) / t2PrimeOf(shim));
}

const signalOf = (t, TE, N, shim, mode = "SE") => decayOf(t, TE, N, shim, T2, mode);
const tissueSignalOf = (tissue, t, TE, N, shim, mode = "SE") => tissue.PD * decayOf(t, TE, N, shim, tissue.T2, mode);

function stageOf(t, TE, N, mode = "SE") {
  if (t < 1.5) return "90° pulse";
  for (let j = 1; j <= N; j++) {
    if (mode === "SE" && Math.abs(t - (j - 0.5) * TE) < 1.5) return "180° pulse";
    if (Math.abs(t - j * TE) < 2) return "echo " + j;
  }
  if (t < TE / 2) return "FID";
  if (mode === "GRE") {
    const u = (t - TE / 2) / TE;
    return u - Math.floor(u) < 0.5 && t < N * TE ? "rephasing" : "dephasing";
  }
  const n = refocusCount(t, TE, N);
  return t < n * TE ? "rephasing" : "dephasing";
}

// ── sequence diagram channels (schematic shapes; gradient lobes not to scale) ──
const sinc = (x) => (Math.abs(x) < 1e-6 ? 1 : Math.sin(Math.PI * x) / (Math.PI * x));
function trap(t, a, b, ramp) {
  if (b <= a || t <= a || t >= b) return 0;
  const r = Math.min(ramp, (b - a) / 3);
  if (t < a + r) return (t - a) / r;
  if (t > b - r) return (b - t) / r;
  return 1;
}

// GRE passes N = 0 here: only the 90° pulse
function rfOf(t, TE, N) {
  const hw = halfWidth(TE);
  let v = 0;
  pulseTimes(TE, N).forEach((tp, i) => {
    const x = t - tp;
    if (Math.abs(x) < hw) v += (i ? 1 : 0.5) * sinc(x / (hw / 3)) * (0.5 + 0.5 * Math.cos((Math.PI * x) / hw));
  });
  return v;
}

function gzOf(t, TE, N) {
  const hw = halfWidth(TE);
  const [a, b] = prephase(TE);
  let v = -0.5 * trap(t, a, (a + b) / 2, 1.5);
  for (const tp of pulseTimes(TE, N)) v += trap(t, tp - hw, tp + hw, 1.5);
  return v;
}

const gyOf = (t, TE) => 0.7 * trap(t, ...prephase(TE), 1.5);

function gxOf(t, TE, N, mode = "SE") {
  if (mode === "GRE") {
    let v = -0.8 * trap(t, halfWidth(TE) + 0.5, TE / 2, 1.5);
    for (let n = 0; n < N; n++) v += (n % 2 === 0 ? 0.6 : -0.6) * trap(t, TE / 2 + n * TE, TE / 2 + (n + 1) * TE, 1.5);
    return v;
  }
  const ro = readHalf(TE);
  let v = 0.5 * trap(t, ...prephase(TE), 1.5);
  for (let j = 1; j <= N; j++) v += trap(t, j * TE - ro, j * TE + ro, 1.5);
  return v;
}

// opts.signed: a difference image (values below zero show black instead of folding back as magnitude)
function makeFilm(svg, slice, keys, part = "film-0", opts = {}) {
  const unpack = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const maps = (makeFilm.cache ||= {});
  const planes = keys.map((key) => (maps[key] ||= unpack(slice[key])));
  const film = svg.querySelector('[data-part="' + part + '"]');
  const canvas = document.createElement("canvas");
  canvas.width = slice.width;
  canvas.height = slice.height;
  const ctx = canvas.getContext("2d");
  const image = ctx.createImageData(slice.width, slice.height);
  let painted = null;
  let grain = null;
  let grainSeed = null;
  // paint(weights, noise, seed): noise is the standard deviation of a Gaussian grain in display units
  // (1 = white); a new seed draws a new grain, as a new acquisition would
  return function paint(weights, noise = 0, seed = opts.seed ?? 12345) {
    const key = weights.concat(noise, seed);
    if (painted && key.every((v, i) => Math.abs(v - painted[i]) < 0.002)) return;
    painted = key;
    if (noise && grainSeed !== seed) {

    const px = image.data;
    for (let p = 0, n = slice.width * slice.height; p < n; p++) {

      for (let i = 0; i < planes.length; i++) v += planes[i][p] * weights[i];

      px[p * 4 + 3] = 255;
    }
    ctx.putImageData(image, 0, 0);
    film.setAttribute("href", canvas.toDataURL());
  };
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// what the user has asked for, what the knobs show, and what the running cycle uses
const want = { TE: 80, N: 1, shim: 1, mode: "SE" };
const shown = { TE: want.TE, N: want.N, shim: want.shim, sw: SWITCH_Y.SE };
let run = { ...want };
let t = 0, hold = 0, frame = 0, last = 0, visible = false, restartTimer = 0, idleTimer = 0, touring = !still.matches, tourAt = 1;
const TOUR = [
  { mode: "SE", TE: 80, N: 1, shim: 1 },
  { mode: "SE", TE: 80, N: 3, shim: 1 },
  { mode: "SE", TE: 80, N: 3, shim: 2.4 },
  { mode: "GRE", TE: 30, N: 3, shim: 0.25 },
  { mode: "GRE", TE: 30, N: 3, shim: 1 },
];
const HOLD = 1.8;
const pressed = { p90: -1e9, p180: -1e9 };
let clockReal = 0;

const refocusing = () => (run.mode === "GRE" ? 0 : run.N); // gradient echoes have no 180° pulses
const valueOf = {
  sig: (ms) => signalOf(ms, run.TE, run.N, run.shim, run.mode),
  rf: (ms) => rfOf(ms, run.TE, refocusing()),
  gz: (ms) => gzOf(ms, run.TE, refocusing()),
  gy: (ms) => gyOf(ms, run.TE),
  gx: (ms) => gxOf(ms, run.TE, run.N, run.mode),
};

function drawEvents() {
  const marks = [];
  for (let j = 1; j <= run.N; j++) { if (run.mode === "SE") marks.push((j - 0.5) * run.TE); marks.push(j * run.TE); }
  events.innerHTML = dotsSvg([0, ...marks].map((ms) => iso([X0 + ms * KX, RULER_Y + 3, RULER_Z], P)), { size: 0.9, tone: "hi" });
  const star = t2StarOf(run.shim);
  const env = [];
  for (let ms = 0; ms <= Math.min(T_SPAN, star * Math.log(100)); ms += 1) env.push(iso([X0 + ms * KX, PAPER_Y, ROWS.sig.base + Math.exp(-ms / star) * ROWS.sig.amp], P));
  envStar.setAttribute("d", pathOf(env));
}

function draw() {
  const end = endOf(run.TE, run.N);
  const now = clamp(t, 0, end);
  const cars = carsAt(K, P, OFFSETS.map((f, i) => phaseOf(f, now, run.TE, run.N, run.shim, run.mode, LANE_POS[i])), LANES, TC, TOP, START).sort((a, b) => a.depth - b.depth);
  back.innerHTML = cars.filter((c) => c.depth < LAMP_DEPTH).map((c) => c.svg).join("");
  front.innerHTML = cars.filter((c) => c.depth >= LAMP_DEPTH).map((c) => c.svg).join("");
  for (const key of Object.keys(traces)) {
    const row = ROWS[key];
    const pts = [];
    for (let ms = 0; ms <= now + 1e-9; ms += 0.5) pts.push(iso([X0 + ms * KX, PAPER_Y, row.base + valueOf[key](ms) * row.amp], P));
    pts.push(iso([X0 + now * KX, PAPER_Y, row.base + valueOf[key](now) * row.amp], P));
    traces[key].setAttribute("d", pathOf(pts));
    pens[key].setAttribute("transform", translateAlong(P, [0, 0, row.base + valueOf[key](now) * row.amp]));
  }
  bridge.setAttribute("transform", translateAlong(P, [X0 + now * KX - PEN_DX, 0, 0]));
  knob.setAttribute("transform", translateAlong(P, [RAIL0 + shown.TE, 0, 0]));
  shimPointer.setAttribute("d", pointerOf(K, P, SHIM_C, shimAngle(shown.shim), 3.6, SHIM_Z));
  nPointer.setAttribute("d", pointerOf(K, P, SELECTOR, -60 + 40 * (shown.N - 1), 5, SEL_Z));
  modeSwitch.setAttribute("transform", translateAlong(P, [0, shown.sw, 0]));
  // films: echo j is exposed over the half-TE before it forms, then held
  films.forEach((paint, i) => {
    const j = i + 1;
    if (j > run.N || now < (j - 0.5) * run.TE) return paint([0, 0, 0]);
    const time = Math.min(now, j * run.TE);
    paint(TISSUES.map((tissue) => tissueSignalOf(tissue, time, run.TE, run.N, run.shim, run.mode)));
  });
  // the start-line lamp glows at each echo, as brightly as the cars are regrouped
  let lit = 0;
  for (let j = 1; j <= run.N; j++) {
    if (now <= (j - 0.5) * run.TE) continue;
    const together = run.mode === "GRE" ? Math.exp((-j * run.TE) / t2PrimeOf(run.shim)) : 1;
    lit = Math.max(lit, Math.exp(-(((now - j * run.TE) / 4) ** 2)) * together);
  }
  glow.setAttribute("opacity", lit.toFixed(2));
  for (const key of ["p90", "p180"]) {
    const dip = Math.exp(-Math.max(0, clockReal - pressed[key]) / 0.22);
    buttons[key].setAttribute("transform", translateAlong(P, [0, 0, -2 * dip]));
  }
  const s = signalOf(now, run.TE, run.N, run.shim, run.mode);
  const text = run.mode + " · TE " + Math.round(run.TE) + " · " + run.N + (run.N > 1 ? " echoes" : " echo") + " · T2* " + Math.round(t2StarOf(run.shim)) + " ms · t " + Math.round(now) + " · " + stageOf(now, run.TE, run.N, run.mode) + " · " + s.toFixed(2);
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}

function restart() {
  if (touring) Object.assign(want, TOUR[tourAt++ % TOUR.length]);
  want.N = Math.min(want.N, maxEchoes(want.TE));
  run = { TE: Math.round(want.TE), N: want.N, shim: want.shim, mode: want.mode };
  t = 0; hold = 0; drawEvents(); pressed.p90 = clockReal;
}

function tick(stamp) {
  const dt = last ? Math.min((stamp - last) / 1000, 1 / 30) : 1 / 60;
  last = stamp;
  clockReal += dt;
  const ease = 1 - Math.exp(-dt / 0.3);
  shown.TE += (want.TE - shown.TE) * ease;
  shown.shim += (want.shim - shown.shim) * ease;
  shown.N += (want.N - shown.N) * ease;
  shown.sw += (SWITCH_Y[want.mode] - shown.sw) * ease;
  const end = endOf(run.TE, run.N);
  if (t < end) {
    const before = t;
    t = Math.min(end, t + (dt * end) / (2 + 1.8 * run.N));
    if (run.mode === "SE") for (let j = 1; j <= run.N; j++) if (before < (j - 0.5) * run.TE && t >= (j - 0.5) * run.TE) pressed.p180 = clockReal;
  } else {
    hold += dt;
    if (hold > HOLD) restart();
  }
  draw();
  frame = visible ? requestAnimationFrame(tick) : 0;
}

const go = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
function steer(change) {
  touring = false;
  Object.assign(want, change);
  want.TE = clamp(Math.round(want.TE), TE_RANGE[0], TE_RANGE[1]);
  want.shim = clamp(want.shim, SHIM_RANGE[0], SHIM_RANGE[1]);
  want.N = clamp(Math.round(want.N), 1, maxEchoes(want.TE));
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; }, 8000);
  if (still.matches) { Object.assign(shown, want, { sw: SWITCH_Y[want.mode] }); run = { ...want }; t = endOf(run.TE, run.N); drawEvents(); draw(); return; }
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => { if (want.TE !== run.TE || want.N !== run.N || want.mode !== run.mode || Math.abs(want.shim - run.shim) > 0.05) restart(); }, 350);
  go();
}
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) go(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  const sx = clamp(((event.clientX - box.left) / box.width - 0.12) / 0.76, 0, 1);
  const sy = clamp(((event.clientY - box.top) / box.height - 0.15) / 0.7, 0, 1);
  steer({ TE: TE_RANGE[0] + sx * (TE_RANGE[1] - TE_RANGE[0]), shim: SHIM_RANGE[0] + sy * (SHIM_RANGE[1] - SHIM_RANGE[0]) });
});
stage.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") steer({ TE: want.TE + 10 });
  else if (event.key === "ArrowLeft") steer({ TE: want.TE - 10 });
  else if (event.key === "ArrowDown") steer({ shim: want.shim + 0.25 });
  else if (event.key === "ArrowUp") steer({ shim: want.shim - 0.25 });
  else if (/^[1-4]$/.test(event.key)) steer({ N: Number(event.key) });
  else if (event.key === "g" || event.key === "G") steer({ mode: want.mode === "SE" ? "GRE" : "SE" });
  else return;
  event.preventDefault();
});
if (still.matches) { run = { TE: 80, N: 3, shim: 1, mode: "SE" }; Object.assign(want, run); Object.assign(shown, run); t = endOf(run.TE, run.N); }
drawEvents();
draw();
</script></body></html>
