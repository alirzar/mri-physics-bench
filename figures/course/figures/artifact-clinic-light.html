<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Artifact clinic</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

egend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Fault panel: spike, motion, truncated, small FOV, EPI ghost, EPI warp (keys 1–6, 0 clears; faults combine)</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Props: spark gap (spike), cam under the subject's sled (motion), end stops on the rails and beam (truncation), magnet (field)</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Film: the k-space actually recorded · sled: the true subject</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Lightbox: the image reconstructed from the recorded k-space (MNI152 slice z = +14 mm)</span></span><span class="iso-caption">Every MRI artifact starts as a fault in k-space. Spike: one corrupt sample, often a static discharge in the scanner room, adds a single spatial frequency to the whole image, so stripes cross everything, outside the head as well (here 45% of the k = 0 value, at kx = 58, ky = 40). Motion: when the head moves between lines, each line is recorded from a slightly different position; repeating motion (here 4 mm every 16 lines, the sled's swing drawn exaggerated) leaves ghosts copied along the phase-encoding direction, never along the readout, because each readout takes only milliseconds. Truncation: stopping at the central 64 × 64 points leaves out the fine detail, and the sharp edges ring (Gibbs). Small field of view: every other line halves the field of view and the head wraps onto itself. EPI ghost: in echo-planar imaging every other line is read in the opposite direction; a timing mismatch between the two (here 0.45 samples and 0.35 rad) makes a ghost shifted by half the field of view, the Nyquist or N/2 ghost. EPI warp: EPI collects so slowly along phase encoding (7.8 Hz per pixel at 0.5 ms per line) that a small field offset moves tissue: here an illustrative 70 Hz offset near the frontal pole, as an air-filled sinus would cause, shifts it by up to 9 mm, stretching and squashing the image. EPI collects a whole slice in about 128 ms, so it freezes the motion that line-by-line imaging (500 ms per line here) smears into ghosts: switch on motion and an EPI fault together and the motion ghosts vanish. All artifacts are computed by Fourier transform from the synthetic slice; their sizes are chosen to be clearly visible. The film is a synthetic image: each 1 mm pixel is the sum of its GM, WM and CSF fractions times that tissue's signal, using the tissue probability maps of the MNI152 ICBM 2009c Nonlinear Asymmetric template (Fonov et al., NeuroImage 2011; via TemplateFlow). Brain only, no skull or scalp; real images add noise, coil shading and tissues this model leaves out. MNI152 template: Copyright (C) 1993–2004 Louis Collins, McConnell Brain Imaging Centre, Montreal Neurological Institute, McGill University.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

// k-space and image reconstruction, shared by the build and the live page.
// The image is the 2D inverse Fourier transform of k-space. Each k-space point (kx, ky) is one spatial
// frequency of the whole image: the centre holds the coarse brightness (contrast), the edges the fine detail.
// The readout gradient sweeps kx along a line; phase encoding steps ky from line to line.
// Matrix N × N with 1 mm pixels gives a 256 mm field of view (FOV = 1/Δk) and 1 mm resolution (1/(2·kmax)).
// Keeping only every other line doubles Δk, halves the FOV, and the image wraps around (aliasing).

const N = 256; // matrix; also the FOV in mm (1 mm pixels)
const CENTRE = 24; // half-width of the central block that "centre" keeps (48 × 48 points)
const TR_MS = 500; // line by line: one excitation (one TR) per line
const ESP_MS = 0.5; // EPI: echo spacing, all lines after one excitation
const MODES = ["lines", "EPI"];
const COVERAGES = [
  { key: "full", label: "full" },
  { key: "centre", label: "centre" },
  { key: "edges", label: "edges" },
  { key: "half", label: "½ lines" },
];

// r, c: rows and columns of centred k-space (ky = r − N/2, kx = c − N/2)
const inBlock = (i) => i - N / 2 >= -CENTRE && i - N / 2 < CENTRE; // k from −CENTRE to CENTRE − 1
function included(cov, r, c) {
  const inCentre = inBlock(r) && inBlock(c);
  if (cov === "centre") return inCentre;
  if (cov === "edges") return !inCentre;
  if (cov === "half") return (r & 1) === 0;
  return true;
}
function rowsOf(cov) {
  const rows = [];
  for (let r = 0; r < N; r++) if (cov === "centre" ? inBlock(r) : cov !== "half" || (r & 1) === 0) rows.push(r);
  return rows;
}
const resolutionOf = (cov) => (cov === "centre" ? N / (2 * CENTRE) : 1); // mm
const fovOf = (cov) => (cov === "half" ? N / 2 : N); // mm, along ky
const scanTimeOf = (mode, cov) => rowsOf(cov).length * (mode === "EPI" ? ESP_MS : TR_MS); // ms

// radix-2 complex FFT of length n, in place; inverse divides by n
function makeFFT(n) {
  const bits = Math.round(Math.log2(n));
  const rev = new Uint32Array(n);
  for (let i = 0; i < n; i++) {
    let r = 0;
    for (let b = 0; b < bits; b++) r |= ((i >> b) & 1) << (bits - 1 - b);
    rev[i] = r;
  }
  const cos = new Float64Array(n), sin = new Float64Array(n);
  for (let k = 0; k < n; k++) { cos[k] = Math.cos((2 * Math.PI * k) / n); sin[k] = Math.sin((2 * Math.PI * k) / n); }
  function fft(re, im, inverse = false) {
    for (let i = 0; i < n; i++) {
      const j = rev[i];
      if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1, step = n / size;
      for (let i = 0; i < n; i += size) {
        for (let j = 0; j < half; j++) {
          const wr = cos[j * step], wi = inverse ? sin[j * step] : -sin[j * step];
          const a = i + j, b = a + half;
          const tr = re[b] * wr - im[b] * wi, ti = re[b] * wi + im[b] * wr;
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        }
      }
    }
    if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
  }
  return { fft, cos, sin };
}

// image (N × N, real) → centred k-space (re, im)
function kspaceOf(image, F) {
  const re = Float64Array.from(image), im = new Float64Array(N * N);
  const rr = new Float64Array(N), ri = new Float64Array(N);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) { rr[x] = re[y * N + x]; ri[x] = im[y * N + x]; }
    F.fft(rr, ri);
    for (let x = 0; x < N; x++) { re[y * N + x] = rr[x]; im[y * N + x] = ri[x]; }
  }
  for (let x = 0; x < N; x++) {
    for (let y = 0; y < N; y++) { rr[y] = re[y * N + x]; ri[y] = im[y * N + x]; }
    F.fft(rr, ri);
    for (let y = 0; y < N; y++) { re[y * N + x] = rr[y]; im[y * N + x] = ri[y]; }
  }
  // centre it: row r, column c hold ky = r − N/2, kx = c − N/2
  const cre = new Float64Array(N * N), cim = new Float64Array(N * N);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const u = (r + N / 2) % N, v = (c + N / 2) % N;
    cre[r * N + c] = re[u * N + v]; cim[r * N + c] = im[u * N + v];
  }
  return { re: cre, im: cim };

// add one acquired k-space line (centred row r, masked by coverage) to the image accumulator (accRe, accIm):
// a 1D inverse FFT along kx, then that line's ky phase ramp across every image row
function addLine(K, r, cov, acc, F) {
  const hr = new Float64Array(N), hi = new Float64Array(N);
  for (let c = 0; c < N; c++) {
    if (!included(cov, r, c)) continue;
    const v = (c + N / 2) % N;
    hr[v] = K.re[r * N + c]; hi[v] = K.im[r * N + c];
  }
  F.fft(hr, hi, true);
  const ky = (r + N / 2) % N;
  for (let y = 0; y < N; y++) {
    const m = (ky * y) % N;
    const c = F.cos[m] / N, s = F.sin[m] / N;
    const row = y * N;
    for (let x = 0; x < N; x++) {
      acc.re[row + x] += hr[x] * c - hi[x] * s;
      acc.im[row + x] += hr[x] * s + hi[x] * c;
    }
  }
}

// Artifact clinic: faults inserted into the k-space acquisition of Fig 7, shared by the build and the page.
// Builds on ../kspace-plotter/model.mjs (N, the FFT, k-space of an image, line-by-line reconstruction).
//   spike      one corrupt k-space sample (e.g. static discharge)        → herringbone stripes over the whole image
//   motion     the head shifts between lines (line by line only)          → ghosts repeated along phase encoding
//   trunc      outer k-space never acquired (64 × 64)                     → ringing beside sharp edges (Gibbs)
//   fov        every other line (field of view halved)                    → wrap-around
//   ghost      EPI: left- and right-going lines misaligned in time        → a ghost shifted by half the FOV
//   warp       EPI: an uneven field shifts tissue along phase encoding    → stretching and squashing
// EPI acquires every line within ~0.1 s, so it freezes motion: the motion fault does nothing in EPI.


const FAULTS = [
  { key: "spike", label: "spike", epi: false, effect: "herringbone stripes" },
  { key: "motion", label: "motion", epi: false, effect: "ghosts along phase encoding" },
  { key: "trunc", label: "truncated", epi: false, effect: "ringing at edges" },
  { key: "fov", label: "small FOV", epi: false, effect: "wrap-around" },
  { key: "ghost", label: "EPI ghost", epi: true, effect: "ghost at half the FOV" },
  { key: "warp", label: "EPI warp", epi: true, effect: "stretched frontal lobe" },

const SPIKE = { r: N / 2 + 40, c: N / 2 + 58, size: 0.45 }; // centred k-space position; size relative to the k = 0 value
const MOTION = { amp: 4, period: 16 }; // mm (pixels), lines per cycle
const TRUNC = 32; // keeps −32 ≤ k < 32 in both directions: a 64 × 64 matrix
const GHOST = { delay: 0.45, phase: 0.35 }; // odd-line readout timing error (samples) and phase error (radians)
const WARP = { peak: -70, x: 128, y: 52, sigma: 22 }; // Hz; illustrative field offset near the frontal pole (pixels)
const BW_PE = 1000 / (N * ESP_MS); // EPI bandwidth per pixel along phase encoding, Hz (7.8 Hz at 0.5 ms spacing)

const isEpi = (on) => !!(on.ghost || on.warp);

function keep(on, r, c) {
  const inBlock = (i) => i - N / 2 >= -TRUNC && i - N / 2 < TRUNC;
  if (on.trunc && !(inBlock(r) && inBlock(c))) return false;
  if (on.fov && r & 1) return false;
  return true;
}
function rowsFor(on) {
  const rows = [];
  for (let r = 0; r < N; r++) {
    let any = false;
    for (let c = 0; c < N && !any; c++) any = keep(on, r, c);
    if (any) rows.push(r);
  }
  return rows;
}

const shiftAt = (line) => MOTION.amp * Math.sin((2 * Math.PI * line) / MOTION.period); // pixels

// EPI distortion: each pixel lands Δy = Δf / BW_PE pixels away along phase encoding (intensity is conserved,
// so stretched regions darken and squashed regions brighten)
function fieldAt(x, y) {
  return WARP.peak * Math.exp(-((x - WARP.x) ** 2 + (y - WARP.y) ** 2) / (2 * WARP.sigma ** 2));
}
// inverse mapping: for each displayed pixel find the tissue that lands there (a few fixed-point steps, since the
// shift changes slowly), sample it, and scale by the Jacobian so stretched tissue thins and squashed tissue piles up
function warp(image) {
  const out = new Float64Array(N * N);
  const shift = (x, y) => fieldAt(x, y) / BW_PE;
  for (let x = 0; x < N; x++) for (let yo = 0; yo < N; yo++) {
    let ys = yo;
    for (let it = 0; it < 5; it++) ys = yo - shift(x, ys);
    const stretch = 1 + (shift(x, ys + 0.5) - shift(x, ys - 0.5));
    const y0 = Math.floor(ys), f = ys - y0;
    const a = y0 >= 0 && y0 < N ? image[y0 * N + x] : 0;
    const b = y0 + 1 >= 0 && y0 + 1 < N ? image[(y0 + 1) * N + x] : 0;
    out[yo * N + x] = ((1 - f) * a + f * b) / Math.max(0.2, stretch);
  }

// the k-space actually recorded: motion phase on every line (line by line only) and the spike
function corrupt(K, on, rows, epi) {
  const re = Float64Array.from(K.re), im = Float64Array.from(K.im);
  if (on.motion && !epi) {
    rows.forEach((r, line) => {
      const a = (-2 * Math.PI * (r - N / 2) * shiftAt(line)) / N; // shift theorem: a shift in y is a phase ramp in ky
      const ca = Math.cos(a), sa = Math.sin(a);
      for (let c = 0; c < N; c++) {
        const i = r * N + c, u = re[i], v = im[i];
        re[i] = u * ca - v * sa; im[i] = u * sa + v * ca;
      }
    });
  }
  if (on.spike) re[SPIKE.r * N + SPIKE.c] += SPIKE.size * Math.hypot(K.re[(N / 2) * N + N / 2], K.im[(N / 2) * N + N / 2]);
  return { re, im };
}

// add one recorded line to the image accumulator; EPI ghost: odd lines (read the other way) carry a timing and

function addFaultyLine(Ka, r, line, on, epi, acc, F) {

  for (let c = 0; c < N; c++) {

const penY = (r) => Y0 + (r + 0.5) * STEP, penX = (c) => X0 + (c + 0.5) * STEP;

// ── the subject, its k-space, and its k-space seen through an uneven field ──
const F = makeFFT(N);
const base = new Float64Array(N * N);
{
  const un = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const gm = un(SLICE.gm), wm = un(SLICE.wm), csf = un(SLICE.csf);
  const r0 = Math.floor((N - SLICE.height) / 2), c0 = Math.floor((N - SLICE.width) / 2);
  for (let y = 0; y < SLICE.height; y++) for (let x = 0; x < SLICE.width; x++) {
    const p = y * SLICE.width + x;
    base[(y + r0) * N + x + c0] = (wm[p] * 1.0 + gm[p] * 0.84 + csf[p] * 0.45) / 255;
  }
}
const K0 = kspaceOf(base, F);
const KW = kspaceOf(warp(base), F);
let fullMax = 0, kTop = 0;
for (let i = 0; i < N * N; i++) { if (base[i] > fullMax) fullMax = base[i]; kTop = Math.max(kTop, Math.hypot(K0.re[i], K0.im[i])); }

const canvasOf = () => { const c = document.createElement("canvas"); c.width = N; c.height = N; return c; };
const paperCanvas = canvasOf(), filmCanvas = canvasOf(), truthCanvas = canvasOf();
const paperCtx = paperCanvas.getContext("2d"), filmCtx = filmCanvas.getContext("2d");
const paperData = paperCtx.createImageData(N, N), filmData = filmCtx.createImageData(N, N);
{
  const ctx = truthCanvas.getContext("2d"), data = ctx.createImageData(N, N);
  for (let i = 0; i < N * N; i++) { const g = Math.round(255 * Math.min(1, base[i] / fullMax)); data.data[i * 4] = data.data[i * 4 + 1] = data.data[i * 4 + 2] = g; data.data[i * 4 + 3] = 255; }
  ctx.putImageData(data, 0, 0);
  truthEl.setAttribute("href", truthCanvas.toDataURL());
}
const BLANK = 14;

// ── scan state ─────────────────────────────────────────────────────────────
const want = {};
let on = {}, epi = false, rows = [], Ka = null, logK = new Float32Array(N * N);
let rowIdx = 0, rowT = 0, lastC = -1, phase = "scan", hold = 0;
let acc = null;
let paperDirty = true, filmDirty = true, lastPaper = -1e9, lastFilm = -1e9, sparkAt = -1e9;
let clock = 0, frame = 0, last = 0, visible = false, touring = !still.matches, idleTimer = 0, tourAt = 1, scrubbing = false;
const shown = { stops: 0, magnet: 0, sled: 0 };
const TOUR = [{}, { spike: true }, { motion: true }, { trunc: true }, { fov: true }, { ghost: true }, { warp: true }, { motion: true, ghost: true }];
const HOLD = 2600;
const rowTime = () => (epi ? clamp(3500 / rows.length, 12, 90) : clamp(6000 / rows.length, 22, 120));

function startScan() {
  on = { ...want };
  epi = isEpi(on);
  rows = rowsFor(on);
  Ka = corrupt(on.warp ? KW : K0, on, rows, epi);
  for (let i = 0; i < N * N; i++) logK[i] = Math.log10(1 + Math.hypot(Ka.re[i], Ka.im[i]) / (1e-4 * kTop)) / Math.log10(1 + 1e4);
  rowIdx = 0; rowT = 0; lastC = -1; phase = "scan"; hold = 0;
  acc = { re: new Float64Array(N * N), im: new Float64Array(N * N) };
  for (let i = 0; i < N * N; i++) { paperData.data[i * 4] = paperData.data[i * 4 + 1] = paperData.data[i * 4 + 2] = BLANK; paperData.data[i * 4 + 3] = 255; }
  paperDirty = filmDirty = true;
}
function expose(r, cFrom, cTo) {
  const a = Math.max(0, Math.min(cFrom, cTo)), b = Math.min(N - 1, Math.max(cFrom, cTo));
  for (let c = a; c <= b; c++) {
    if (!keep(on, r, c)) continue;
    const g = Math.round(BLANK + 236 * Math.min(1, logK[r * N + c]));
    const p = (r * N + c) * 4;
    paperData.data[p] = paperData.data[p + 1] = paperData.data[p + 2] = g;
  }
  paperDirty = true;
}
function completeRow() {
  const r = rows[rowIdx];
  expose(r, 0, N - 1);
  addFaultyLine(Ka, r, rowIdx, on, epi, acc, F);
  if (on.spike && r === SPIKE.r) sparkAt = clock;
  filmDirty = true;
  rowIdx += 1;
  lastC = -1;
  if (rowIdx >= rows.length) { phase = "hold"; hold = 0; }
}
// the pen's sweep along a line: the whole line, or only the central block when the end stops are in
function penC() {
  const lo = on.trunc ? N / 2 - TRUNC : 0, span = (on.trunc ? N / 2 + TRUNC - 1 : N - 1) - lo;
  if (epi) { const forward = rowIdx % 2 === 0; return { c: lo + (forward ? rowT : 1 - rowT) * span, on: true }; }
  if (rowT < 0.85) return { c: lo + (rowT / 0.85) * span, on: true };
  return { c: lo + (1 - (rowT - 0.85) / 0.15) * span, on: false };
}
function renderFilm() {
  let top = 0;
  const mag = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) { mag[i] = Math.hypot(acc.re[i], acc.im[i]); if (mag[i] > top) top = mag[i]; }
  const win = Math.max(top, 0.25 * fullMax);
  for (let i = 0; i < N * N; i++) {
    const g = Math.round(255 * Math.min(1, mag[i] / win));
    filmData.data[i * 4] = filmData.data[i * 4 + 1] = filmData.data[i * 4 + 2] = g;
    filmData.data[i * 4 + 3] = 255;
  }
  filmCtx.putImageData(filmData, 0, 0);
  filmEl.setAttribute("href", filmCanvas.toDataURL());
}
function renderPaper() {
  paperCtx.putImageData(paperData, 0, 0);
  paperEl.setAttribute("href", paperCanvas.toDataURL());
}

function draw() {
  const r = rows[Math.min(rowIdx, rows.length - 1)];
  const pen = phase === "scan" ? penC() : { c: N / 2 };
  const c = pen.c;
  gantry.setAttribute("transform", translateAlong(P, [0, penY(r) - PEN_DY, 0]));
  carriage.setAttribute("transform", translateAlong(P, [penX(c), 0, 0]));
  for (const side of ["back", "front"]) stops[side].setAttribute("transform", translateAlong(P, [0, STOP_OFF[side] + (STOP_ON[side] - STOP_OFF[side]) * shown.stops, 0]));
  for (const side of ["left", "right"]) stops[side].setAttribute("transform", translateAlong(P, [STOP_OFF[side] + (STOP_ON[side] - STOP_OFF[side]) * shown.stops, 0, 0]));
  sparkEl.setAttribute("opacity", Math.exp(-Math.max(0, clock - sparkAt) / 260).toFixed(2));
  const line = Math.min(rowIdx, rows.length - 1);
  const swing = on.motion && !epi && phase === "scan" ? shiftAt(line + rowT) * MOTION_SHOWN : 0;
  shown.sled += (swing - shown.sled) * 0.5;
  sled.setAttribute("transform", translateAlong(P, [0, shown.sled, 0]));
  const angle = (2 * Math.PI * (line + rowT)) / MOTION.period;
  camPin.innerHTML = solidSvg(cylinder(CAM[0] + 1.7 * Math.cos(angle), CAM[1] + 1.7 * Math.sin(angle), 0.8, 4, 2.2, P, 12), { tone: "hi", crease: "lo" });
  magnetEl.setAttribute("transform", translateAlong(P, [MAGNET_AWAY * (1 - shown.magnet), 0, 0]));
  magnetGlow.setAttribute("opacity", shown.magnet.toFixed(2));
  for (const f of FAULTS) {
    const s = switches[f.key];
    s.lever.setAttribute("transform", translateAlong(P, [0, -2.5 + 5 * s.shown, 0]));
    s.lamp.setAttribute("opacity", s.shown.toFixed(2));
  }
  if (paperDirty && (clock - lastPaper > 70 || phase !== "scan")) { renderPaper(); paperDirty = false; lastPaper = clock; }
  if (filmDirty && (clock - lastFilm > 60 || phase !== "scan")) { renderFilm(); filmDirty = false; lastFilm = clock; }
  const active = FAULTS.filter((f) => on[f.key]);
  let what = "no faults";
  if (active.length === 1) what = active[0].label + " → " + (active[0].key === "motion" && epi ? "frozen by EPI" : active[0].effect);
  else if (active.length > 1) what = active.map((f) => f.label + (f.key === "motion" && epi ? " (frozen)" : "")).join(" + ");
  const text = (epi ? "EPI" : "lines") + " · " + what + " · " + Math.min(rowIdx, rows.length) + "/" + rows.length;
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}

function tick(stamp) {
  const dt = last ? Math.min(stamp - last, 50) : 16;
  last = stamp;
  clock += dt;
  const ease = 1 - Math.exp(-dt / 250);
  shown.stops += ((on.trunc ? 1 : 0) - shown.stops) * ease;
  shown.magnet += ((on.warp ? 1 : 0) - shown.magnet) * ease;
  for (const f of FAULTS) switches[f.key].shown += ((want[f.key] ? 1 : 0) - switches[f.key].shown) * ease;
  if (!scrubbing) {
    if (phase === "scan") {
      rowT += dt / rowTime();
      while (phase === "scan" && rowT >= 1) { rowT -= 1; completeRow(); }
      if (phase === "scan") {
        const pen = penC();
        if (pen.on) { const c = Math.round(pen.c); expose(rows[rowIdx], lastC < 0 ? c : lastC, c); lastC = c; }
      }
    } else {
      hold += dt;
      if (hold > HOLD) {
        if (touring) { for (const key of Object.keys(want)) delete want[key]; Object.assign(want, TOUR[tourAt++ % TOUR.length]); }
        startScan();
      }
    }
  }
  draw();
  frame = visible ? requestAnimationFrame(tick) : 0;
}

function seek(n) {
  n = clamp(Math.round(n), 0, rows.length);
  if (n < rowIdx) { const keepOn = { ...on }; for (const key of Object.keys(want)) delete want[key]; Object.assign(want, keepOn); startScan(); }
  while (rowIdx < n) completeRow();
  if (rowIdx < rows.length) { phase = "scan"; rowT = 0; lastC = -1; }
  paperDirty = filmDirty = true;
  lastPaper = lastFilm = -1e9;
  draw();
}
function settleProps() {
  shown.stops = on.trunc ? 1 : 0;
  shown.magnet = on.warp ? 1 : 0;
  for (const f of FAULTS) switches[f.key].shown = want[f.key] ? 1 : 0;
}

const go = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
function user() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; scrubbing = false; }, 10000);
}
function apply() {
  user();
  scrubbing = false;
  startScan();
  if (still.matches) { settleProps(); seek(rows.length); return; }
  go();
}
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) go(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  user();
  scrubbing = true;
  const box = svg.getBoundingClientRect();
  seek(clamp(((event.clientX - box.left) / box.width - 0.12) / 0.76, 0, 1) * rows.length);
  go();
});
stage.addEventListener("pointerleave", () => { scrubbing = false; });
stage.addEventListener("click", apply);
stage.addEventListener("keydown", (event) => {
  if (/^[1-6]$/.test(event.key)) { const key = FAULTS[Number(event.key) - 1].key; want[key] = !want[key]; apply(); }
  else if (event.key === "0") { for (const key of Object.keys(want)) delete want[key]; apply(); }
  else if (event.key === "Enter" || event.key === " ") apply();
  else if (event.key === "ArrowRight" || event.key === "ArrowLeft") { user(); scrubbing = true; seek(rowIdx + (event.key === "ArrowRight" ? 16 : -16)); go(); }
  else return;
  event.preventDefault();
});
startScan();
if (still.matches) { Object.assign(want, { spike: true }); startScan(); settleProps(); seek(rows.length); }
else { renderPaper(); renderFilm(); draw(); }
</script></body></html>
