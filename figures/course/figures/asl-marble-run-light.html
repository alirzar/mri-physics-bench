<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ASL marble run</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

ath class="iso-shade" data-shade="0" d="M386.4 316.9L385.6 317.3L385.6 315.6L386.4 315.2ZM387 315.8L386.9 316.3L386.9 314.6L387 314.1ZM386.9 316.3L386.4 316.9L386.4 315.2L386.9 314.6Z"/><path class="iso-shade" data-shade="1" d="M385.6 317.3L384.6 317.5L384.6 315.8L385.6 315.6ZM384.6 317.5L383.5 317.6L383.5 315.9L384.6 315.8Z"/><path class="iso-shade" data-shade="2" d="M383.5 317.6L382.3 317.5L382.3 315.9L383.5 315.9ZM382.3 317.5L381.3 317.3L381.3 315.6L382.3 315.9Z"/><path class="iso-shade" data-shade="3" d="M381.3 317.3L380.5 316.9L380.5 315.2L381.3 315.6ZM380.5 316.9L380 316.4L380 314.7L380.5 315.2ZM380 316.4L379.8 315.8L379.8 314.2L380 314.7Z"/><path class="iso-top" d="M386.4 315.2L385.6 315.6L384.6 315.8L383.5 315.9L382.3 315.9L381.3 315.6L380.5 315.2L380 314.7L379.8 314.2L379.9 313.6L380.4 313.1L381.2 312.7L382.2 312.4L383.3 312.3L384.4 312.4L385.5 312.6L386.3 313L386.8 313.5L387 314.1L386.9 314.6Z"/><path class="iso-line iso-crease" data-tone="faint" d="M387 314.1L386.9 314.6L386.4 315.2L385.6 315.6L384.6 315.8L383.5 315.9L382.3 315.9L381.3 315.6L380.5 315.2L380 314.7L379.8 314.2"/><path class="iso-line iso-edge" data-tone="hi" d="M379.8 314.2L379.9 313.6L380.4 313.1L381.2 312.7L382.2 312.4L383.3 312.3L384.4 312.4L385.5 312.6L386.3 313L386.8 313.5L387 314.1M387 315.8L386.9 316.3L386.4 316.9L385.6 317.3L384.6 317.5L383.5 317.6L382.3 317.5L381.3 317.3L380.5 316.9L380 316.4L379.8 315.8M379.8 314.2L379.8 315.8M387 314.1L387 315.8"/></g></g><text class="iso-face-text" data-tone="mid" transform="matrix(1.144 0.401 -0.801 0.572 376.979 321.84)" font-size="3.6" text-anchor="middle">control</text><text class="iso-face-text" data-tone="mid" transform="matrix(1.144 0.401 0 1.21 277.67 297.255)" font-size="4" text-anchor="start">pCASL · label 1.8 s</text><g class="iso-dots" data-tone="mid"><circle cx="316.7" cy="259" r="0.45"/><circle cx="276.6" cy="287.6" r="0.45"/><circle cx="431.1" cy="299" r="0.45"/><circle cx="391.1" cy="327.6" r="0.45"/></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Tagged marbles: labelled blood water; the tag fades with blood T1 (1650 ms)</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Readout: grey-matter ΔM as a share of its signal, and CBF in grey/white matter (ml/100 g/min) as the scanner would compute it</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Coil round the neck track: the labelling plane · trays: grey matter, white matter, CSF</span><span class="iso-key"><svg class="iso-swatch" data-mark="dotted" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Lit dots: grey- and white-matter transit times on the PLD scale; end of labelling and readout on the stopwatch (one turn = 5 s)</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Lightbox: control, label, their difference, and the average of the chosen number of pairs (MNI152 slice z = +14 mm)</span></span><span class="iso-caption">Arterial spin labelling measures blood flow with blood water as its own tracer. For 1.8 s an RF coil at the neck inverts the magnetization of blood flowing past (pseudo-continuous ASL, labelling efficiency 0.85); after a post-labelling delay (PLD) the labelled water has reached the brain and exchanged into tissue, and an image is taken. A control image is taken the same way without labelling, and the difference, control − label, is proportional to cerebral blood flow (CBF). The difference is tiny: about 0.7% of the grey-matter signal at the recommended PLD of 1.8 s, so control and label look identical and a single pair is mostly noise (here a single pair gives a grey-matter signal-to-noise ratio of about 1, an illustrative figure). Averaging N pairs improves it by √N. Timing matters. Labelled blood takes a transit time to arrive (here 1200 ms for grey matter and 1600 ms for white matter), and the label decays with blood T1 (1650 ms at 3 T) on the way. The scanner computes CBF = 6000 · λ · ΔM · e^(PLD/T1b) / (2 · α · T1b · M0 · (1 − e^(−τ/T1b))), with λ = 0.9 ml/g, which is right only when the PLD is longer than the transit time: shorten the PLD below the lit dots and the estimates fall (to about 32 and 6 ml/100 g/min at 600 ms instead of 60 and 20); lengthen it and the estimates stay right but the signal, and so the signal-to-noise ratio, falls. CSF has no blood flow and stays dark. Signal model: the general kinetic model for pCASL (Buxton et al. 1998) with the consensus simplifications (Alsop et al. 2015). The marble run is drawn at 0.6× real time; each marble stands for a great many water molecules, grey matter receives three times the flow of white matter, and the tracks' lengths are not to scale. The film is a synthetic image: each 1 mm pixel is the sum of its GM, WM and CSF fractions times that tissue's signal, using the tissue probability maps of the MNI152 ICBM 2009c Nonlinear Asymmetric template (Fonov et al., NeuroImage 2011; via TemplateFlow). Brain only, no skull or scalp; real images add noise, coil shading and tissues this model leaves out. MNI152 template: Copyright (C) 1993–2004 Louis Collins, McConnell Brain Imaging Centre, Montreal Neurological Institute, McGill University.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;

// ── polylines ─────────────────────────────────────────────────────────────
const lengthOf = (pts) => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1], p[2] - pts[i][2]), 0);
function along(pts, u) {
  let left = clamp(u, 0, 1) * lengthOf(pts);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const seg = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    if (left <= seg || i === pts.length - 1) { const s = seg ? Math.min(1, left / seg) : 1; return [0, 1, 2].map((j) => a[j] + (b[j] - a[j]) * s); }
    left -= seg;
  }
  return pts[pts.length - 1];
}

// ── state ─────────────────────────────────────────────────────────────────
let want = { pld: 1800, avg: 16 };
let run = { pld: want.pld, avg: want.avg };
let pldShown = want.pld, avgShown = AVERAGES.indexOf(want.avg);
let now = 0, trStart = 0, phase = "label", readDone = false, flashAt = -1e9, pairs = 0, seed = 1;
let nextN = 0;
const marbles = new Map();
const slotsUsed = { gm: 0, wm: 0, csf: 0 };
let frame = 0, last = 0, visible = false, touring = !still.matches, idleTimer = 0, tourAt = 1;
const TOUR = [{ pld: 1800, avg: 1 }, { pld: 1800, avg: 16 }, { pld: 1800, avg: 64 }, { pld: 600, avg: 64 }];
const trLength = () => TAU + run.pld + READ_TAIL;

function spawn() {
  while (nextN / RATE <= now) {
    const n = nextN++;
    marbles.set(n, { n, emit: n / RATE, branch: n % 4 === 2 ? "wm" : "gm", passed: false, tagged: false, slot: null, landed: false });
  }
}

function update() {
  for (const m of marbles.values()) {
    const s = now - m.emit;
    if (!m.passed && s >= T0) {
      m.passed = true;
      const passTime = m.emit + T0;
      if (phase === "label" && passTime - trStart >= 0 && passTime - trStart <= TAU) { m.tagged = true; m.tagTime = passTime; }
    }
    if (m.tagged && m.slot === null && s >= T0 + TC) {
      const tray = TRAYS[m.branch];
      m.slot = slotOf(tray, Math.min(slotsUsed[m.branch]++, tray.cols * tray.rows - 1));
    }
    if (!m.landed && s >= T0 + ATT[m.branch]) { m.landed = true; m.landTime = m.emit + T0 + ATT[m.branch]; }
    if (m.landed && !m.tagged && now - m.landTime > 350) marbles.delete(m.n);
    if (m.landed && m.tagged && m.cleared) marbles.delete(m.n);
  }
}

function positionOf(m) {
  const s = now - m.emit;
  if (s < T0) return along(PATH_IN, s / T0);
  if (s < T0 + TC) return along(PATH_C, (s - T0) / TC);
  const tray = TRAYS[m.branch];
  const end = m.slot || [tray.x + 8 + ((m.n * 7) % (tray.w - 16)), tray.y + 6 + ((m.n * 5) % (tray.d - 12)), TRAY_H + MR];
  if (s < T0 + ATT[m.branch]) return along(TAIL[m.branch].concat([end]), (s - T0 - TC) / (ATT[m.branch] - TC));
  return end;
}

function readoutNow() {
  readDone = true;
  flashAt = now;
  seed += 1;
  const r = TISSUES.map((t) => deltaMOf(t, run.pld));
  if (phase === "label") films.label(TISSUES.map((t, i) => t.PD * (1 - r[i])), NOISE, seed);
  else paintPair(seed);
}

function paintPair(s) {
  const r = TISSUES.map((t) => deltaMOf(t, run.pld));
  films.control(TISSUES.map((t) => t.PD), NOISE, s);
  films.diff(TISSUES.map((t, i) => (t.PD * r[i]) / WIN), (NOISE * Math.SQRT2) / WIN, s + 1000);
  films.avg(TISSUES.map((t, i) => (t.PD * r[i]) / WIN), (NOISE * Math.SQRT2) / Math.sqrt(run.avg) / WIN, s + 2000);
}

function nextTR() {
  for (const m of marbles.values()) if (m.tagged && m.landed) m.cleared = true;
  slotsUsed.gm = slotsUsed.wm = 0;
  if (phase === "label") phase = "control";
  else {
    phase = "label";
    pairs += 1;
    if (touring) Object.assign(want, TOUR[tourAt++ % TOUR.length]);
    run = { pld: want.pld, avg: want.avg };
  }
  trStart = now;
  readDone = false;
}

function step(dt) {
  now += dt;
  spawn();
  update();
  const t = now - trStart;
  if (!readDone && t >= TAU + run.pld) readoutNow();
  if (t >= trLength()) nextTR();
}

function draw() {
  // marbles, back to front
  const items = [...marbles.values()].map((m) => { const p = positionOf(m); return { m, p, depth: depthOf(p, P) }; }).sort((a, b) => a.depth - b.depth);
  const rr = (MR * KPERP).toFixed(2);
  marblesEl.innerHTML = items.map(({ m, p }) => {
    const [cx, cy] = iso(p, P);
    const label = m.tagged ? labelLeft(now - m.tagTime) : 0;
    return '<circle class="asl-marble" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + rr + '"/>' +
      (label > 0.02 ? '<circle class="asl-tag" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + rr + '" opacity="' + label.toFixed(2) + '"/>' : "");
  }).join("");
  const t = now - trStart;
  coilGlow.setAttribute("opacity", phase === "label" && t <= TAU ? "1" : "0");
  lamps.label.setAttribute("opacity", phase === "label" ? "1" : "0");
  lamps.control.setAttribute("opacity", phase === "control" ? "1" : "0");
  flash.setAttribute("opacity", Math.exp(-Math.max(0, now - flashAt) / 250).toFixed(2));
  knob.setAttribute("transform", translateAlong(P, [RAIL0 + pldShown / 25, 0, 0]));
  avgPointer.setAttribute("d", pointerOf(K, P, AVG_KNOB, AVG_DETENTS[0] + avgShown * 40, 4.4, AVG_Z));
  const angle = (ms) => (360 * (ms % WATCH_SPAN)) / WATCH_SPAN;
  needle.setAttribute("d", pointerOf(K, P, WATCH, angle(t), WATCH_R - 3.2, WATCH_TOP + 0.2, 3));
  watchMarks.innerHTML = dotsSvg([TAU, TAU + run.pld].map((ms) => { const a = (angle(ms) * Math.PI) / 180; return iso([WATCH[0] + Math.sin(a) * (WATCH_R - 1.6), WATCH[1] - Math.cos(a) * (WATCH_R - 1.6), WATCH_TOP], P); }), { size: 1, tone: "hi" });
  const rg = deltaMOf(GM, run.pld), rw = deltaMOf(WM, run.pld);
  const text = phase + " · PLD " + Math.round(run.pld) + " · ΔM " + (rg * 100).toFixed(2) + "% · CBF " + Math.round(cbfFrom(rg, run.pld)) + "/" + Math.round(cbfFrom(rw, run.pld)) + " · " + run.avg + (run.avg > 1 ? " pairs" : " pair");
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}

function tick(stamp) {
  const dt = last ? Math.min(stamp - last, 50) : 16;
  last = stamp;
  const ease = 1 - Math.exp(-dt / 300);
  pldShown += (want.pld - pldShown) * ease;
  avgShown += (AVERAGES.indexOf(want.avg) - avgShown) * ease;
  let simDt = dt * SPEED;
  while (simDt > 0) { const h = Math.min(simDt, 10); step(h); simDt -= h; }
  draw();
  frame = visible ? requestAnimationFrame(tick) : 0;
}

const go = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
function steer(change) {
  touring = false;
  Object.assign(want, change);
  want.pld = clamp(Math.round(want.pld / 50) * 50, PLD_RANGE[0], PLD_RANGE[1]);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; }, 9000);
  if (still.matches) { settle(); return; }
  go();
}
// still frame: run one full pair at the chosen settings, then stop at the label readout of the next
function settle() {
  run = { ...want };
  pldShown = want.pld;
  avgShown = AVERAGES.indexOf(want.avg);
  now = 0; trStart = 0; phase = "label"; readDone = false; nextN = 0; marbles.clear(); slotsUsed.gm = slotsUsed.wm = 0;
  const target = 2 * trLength() + TAU + run.pld + 1;
  while (now < target) step(10);
  flashAt = -1e9;
  draw();
}
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) go(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  steer({ pld: clamp(((event.clientX - box.left) / box.width - 0.12) / 0.76, 0, 1) * PLD_RANGE[1] });
});
stage.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") steer({ pld: want.pld + 100 });
  else if (event.key === "ArrowLeft") steer({ pld: want.pld - 100 });
  else if (/^[1-4]$/.test(event.key)) steer({ avg: AVERAGES[Number(event.key) - 1] });
  else return;
  event.preventDefault();
});
// first paint: films as they would look after one pair at the starting settings
films.label(TISSUES.map((t) => t.PD * (1 - deltaMOf(t, run.pld))), NOISE, 7);
paintPair(7);
if (still.matches) settle(); else draw();
</script></body></html>
